[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "social-pulse"
version = "0.5.1"
description = "Browserless CLI and HTTP API for engagement metrics on public TikTok, Instagram, Facebook, X and YouTube posts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "social-pulse contributors" }]
keywords = ["social media", "analytics", "engagement", "tiktok", "instagram", "youtube", "x", "facebook", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["curl_cffi>=0.7", "yt-dlp", "pydantic>=2", "typer>=0.12", "rich>=13"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest", "httpx", "fastapi>=0.110", "uvicorn>=0.29", "ruff"]

[project.scripts]
social-pulse = "pulse.cli:app"
pulse-api = "pulse.api:main"

[tool.setuptools.packages.find]
include = ["pulse*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
